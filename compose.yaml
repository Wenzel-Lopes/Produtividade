services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: produtividade
      POSTGRES_USER: produtividade
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - produtividade_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U produtividade -d produtividade"]
      interval: 5s
      timeout: 3s
      retries: 15
volumes:
  produtividade_pg:
