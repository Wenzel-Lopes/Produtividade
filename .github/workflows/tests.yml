name: Verificação Produtividade
on: [push, pull_request]
jobs:
  pipeline:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: produtividade_test
          POSTGRES_USER: produtividade
          POSTGRES_PASSWORD: ci_only_not_a_secret
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U produtividade -d produtividade_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://produtividade:ci_only_not_a_secret@localhost:5432/produtividade_test
      PRODUTIVIDADE_TEST_POSTGRES: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-postgres.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m produtividade demo
